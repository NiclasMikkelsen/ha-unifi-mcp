name: UniFi MCP (site)
version: "0.1.0"
slug: unifi_mcp
description: Read-only UniFi Network MCP server bound to one site's local console
url: https://github.com/nvm1995/ha-unifi-mcp/tree/main/unifi-mcp
arch:
  - amd64
  - aarch64
init: false
host_network: true
startup: services
boot: auto
options:
  unifi_local_host: "192.168.1.1"
  unifi_api_key: ""
  unifi_profile: network
  unifi_read_only: true
  mcp_port: 8765
  mcp_auth_token: ""
schema:
  unifi_local_host: str
  unifi_api_key: password
  unifi_profile: list(minimal|network|devices|security|system)
  unifi_read_only: bool
  mcp_port: port
  mcp_auth_token: password
