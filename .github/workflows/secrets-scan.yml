name: Secrets scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Repot är publikt och kan därför inte anropa det privata flödet i
# NiclasMikkelsen/agent-ci — en publik anropare kan inte läsa en privat
# källa. Filen är en medveten kopia; övriga repon anropar agent-ci.
#
# gitleaks/gitleaks-action@v2 togs bort eftersom den kräver betald licens för
# organisationer och avbryter innan den scannar. CLI:n har ingen sådan grind.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hämta gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (sök läckta hemligheter)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks git --log-opts="origin/${BASE_REF}..HEAD" --redact -v --no-banner .
          else
            gitleaks dir --redact -v --no-banner .
          fi
