name: Secrets scan

# gitleaks-action@v2 kräver GITLEAKS_LICENSE så snart ägaren är en organisation,
# och repot ägs av org `NiclasMikkelsen`. CLI-binären är gratis även för orgar,
# så den hämtas pinnad med verifierad checksumma i stället för att gå via
# actionen. Bumpa GITLEAKS_VERSION och GITLEAKS_SHA256 tillsammans.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hämta gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/${tarball}" -C /tmp/gitleaks gitleaks

      - name: Gitleaks (sök läckta hemligheter)
        run: /tmp/gitleaks/gitleaks git --redact --no-banner --verbose .
